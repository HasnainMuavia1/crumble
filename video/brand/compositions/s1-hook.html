  <script>
    const tl = gsap.timeline({ paused: true });
    // the cookie falls onto the blue and squashes on landing (0.42 s)
    tl.fromTo("#s1-ck", { y: -480, rotation: -24, scale: 1.18, rotationX: 75, rotationY: -55, transformPerspective: 1300 }, { y: 0, rotation: -5, scale: 1, rotationX: 0, rotationY: 0, duration: 0.42, ease: "power3.in" }, 0);
    // impact: comic burst + camera shake
    tl.fromTo("#s1-burst", { scale: 0.5, opacity: 1, rotation: 0 }, { immediateRender: false, scale: 1.5, opacity: 0, rotation: 12, duration: 0.45, ease: "expo.out" }, 0.42);
    [[14,-10],[-12,8],[8,6],[-5,-4],[0,0]].forEach(([x,y],i)=>tl.to("#s1-cam",{x,y,duration:0.045,ease:"none"},0.42+i*0.045));
    tl.fromTo("#s1-ck", { scaleX: 1, scaleY: 1 }, { scaleX: 1.07, scaleY: 0.9, duration: 0.08, ease: "power2.out" }, 0.42);
    tl.to("#s1-ck", { scaleX: 1, scaleY: 1, duration: 0.7, ease: "elastic.out(1, 0.45)" }, 0.5);
    // CRUMBLE rises letter by letter behind it
    tl.fromTo("#s1-word span", { yPercent: 40, opacity: 0, rotationX: -95, transformPerspective: 900, transformOrigin: "50% 100%" }, { yPercent: 0, opacity: 1, rotationX: 0, duration: 0.75, ease: "expo.out", stagger: 0.05 }, 0.05);
    // crumbs jump out of the landing
    const crumbs = [[-420, -260, -160], [-260, -360, 200], [-120, -300, -260], [140, -340, 240], [300, -280, -180], [460, -220, 300]];
    crumbs.forEach(([dx, up, rot], i) => {
      const el = "#s1-c" + (i + 1);
      tl.fromTo(el, { x: 0, opacity: 0, rotation: 0 }, { x: dx, opacity: 1, rotation: rot, duration: 1.1, ease: "power1.out" }, 0.42);
      tl.fromTo(el, { y: 0 }, { y: up, duration: 0.42, ease: "power2.out" }, 0.42);
      tl.to(el, { y: 420, duration: 0.7, ease: "power2.in" }, 0.84);
    });
    // sticker pops and turns
    tl.fromTo("#s1-sticker", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2)" }, 0.9);
    tl.fromTo("#s1-sticker svg", { rotation: 0 }, { rotation: 140, duration: 2.75, ease: "none" }, 0.9);
    // Thick. Gooey. Stuffed. on beats 3, 4, 5
    ["#s1-t1", "#s1-t2", "#s1-t3"].forEach((w, i) => {
      tl.fromTo(w, { opacity: 0, scale: 1.35, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, 1.36 + i * 0.4535);
    });
    // exit: punch into the crack
    tl.to("#s1-ck", { scale: 1.35, duration: 0.4, ease: "power2.in" }, 3.25);
    // slow 3D sway while it rests (the world moves, the titles stay still)
    tl.fromTo("#s1-ck", { rotationY: 0 }, { rotationY: 14, duration: 2.6, ease: "sine.inOut", transformPerspective: 1300 }, 0.8);
    tl.to("#s1-word, #s1-tag, #s1-sticker", { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in" }, 3.3);
    window.__timelines["s1-hook"] = tl;
